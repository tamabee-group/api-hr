# ============================================================
# Tamabee Nginx Reverse Proxy
# ============================================================
# Nginx cài trực tiếp trên VPS (không qua Docker)
#
# Cài đặt trên VPS:
#   sudo apt install nginx -y
#   sudo cp nginx.conf /etc/nginx/sites-available/hr-api.tamabee.vn
#   sudo ln -s /etc/nginx/sites-available/hr-api.tamabee.vn /etc/nginx/sites-enabled/
#   sudo rm /etc/nginx/sites-enabled/default
#   sudo nginx -t
#   sudo systemctl reload nginx
# ============================================================

upstream api_backend {
    server 127.0.0.1:8081;          # Docker container expose port 8081 trên localhost
}

# Rate limiting
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

server {
    listen 80;
    server_name hr-api.tamabee.vn;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Giới hạn upload size (phù hợp với uploads/ directory)
    client_max_body_size 10M;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # Health check endpoint (public, cho monitoring bên ngoài)
    location = /actuator/health {
        proxy_pass http://127.0.0.1:9090;
        proxy_set_header Host $host;
        access_log off;
    }

    # CHẶN truy cập toàn bộ Actuator khác từ bên ngoài
    location /actuator {
        deny all;
        return 403;
    }

    # CHẶN truy cập Swagger trên production
    location ~ ^/(swagger-ui|v3/api-docs) {
        deny all;
        return 403;
    }

    # Auth endpoints - rate limit chặt hơn (chống brute force)
    location ~ ^/api/(auth|login|register) {
        limit_req zone=auth_limit burst=10 nodelay;

        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API endpoints
    location / {
        limit_req zone=api_limit burst=50 nodelay;

        proxy_pass http://api_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (cho Spring WebSocket)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Favicon
    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
}

# ============================================================
# SSL Configuration (setup sau khi domain đã trỏ về VPS)
# ============================================================
# Chạy trên VPS:
#   sudo apt install certbot python3-certbot-nginx -y
#   sudo certbot --nginx -d hr-api.tamabee.vn
#
# Certbot sẽ TỰ ĐỘNG:
#   - Tạo SSL certificate
#   - Sửa nginx config thêm HTTPS block
#   - Thêm redirect HTTP → HTTPS
#   - Setup auto-renew cronjob
# ============================================================
