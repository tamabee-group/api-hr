spring:
  application:
    name: api-hr

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/tamabee_master}
    username: ${DATABASE_USERNAME:postgres}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none # Multi-tenant: Flyway quản lý schema, không validate vì entities có thể ở tenant DB
    show-sql: false
    open-in-view: false # Tắt lazy loading ngoài @Transactional → tránh N+1 query ẩn
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc:
          lob:
            non_contextual_creation: true

  flyway:
    enabled: false # Disable auto-run, FlywayMultiTenantConfig sẽ quản lý
    baseline-on-migrate: true
    clean-disabled: true # QUAN TRỌNG: Không cho phép clean database
    target: 2 # Chỉ chạy V1, V2 (bỏ qua V3 test data)
    # Multi-tenant: Master DB dùng db/master, Tenant DB dùng db/tenant

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    protocol: smtps
    properties:
      mail:
        smtps:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false
        debug: true

server:
  port: ${SERVER_PORT}

logging:
  level:
    root: INFO
    com.tamabee: DEBUG

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    enabled: true

jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:2592000000}

app:
  admin-email: ${ADMIN_EMAIL}
  mail-from: ${MAIL_FROM:Tamabee <info@tamabee.vn>}
  base-url: ${BASE_URL}
  frontend-url: ${FRONTEND_URL}

database:
  tunnel:
    enabled: ${DATABASE_TUNNEL_ENABLED:false}
    ssh:
      host: ${SSH_HOST:}
      port: ${SSH_PORT:22}
      username: ${SSH_USERNAME:}
      password: ${SSH_PASSWORD:}
    local:
      port: ${LOCAL_PORT:5433}
    remote:
      host: ${REMOTE_HOST:localhost}
      port: ${REMOTE_PORT:5432}

google:
  calendar:
    api-key: ${GOOGLE_CALENDAR_API_KEY:}
