<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #fff;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #fff;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0"
                    style="background-color: #ffffff; border-radius: 4px; overflow: hidden;">
                    <!-- Header với logo -->
                    <tr>
                        <td style="background-color: #232f3e; padding: 24px; text-align: center;">
                            <img src="cid:logo" alt="Tamabee"
                                style="height: 40px; width: auto; vertical-align: middle; margin-right: 8px;">
                            <img src="cid:logoText" alt="Tamabee"
                                style="height: 32px; width: auto; vertical-align: middle;">
                        </td>
                    </tr>

                    <!-- Nội dung chính -->
                    <tr>
                        <td style="padding: 30px 20px;">
                            <h1 style="margin: 0 0 20px; font-size: 24px; font-weight: bold; color: #00b1ce;">
                                📅 Thông báo lịch phân ca
                            </h1>
                            <p style="margin: 0 0 20px; font-size: 16px; color: #333;">
                                Xin chào {employeeName},
                            </p>
                            <p style="margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #333;">
                                Lịch phân ca của bạn đã được cập nhật cho <strong>{weekInfo}</strong>.
                            </p>
                            <p style="margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #333;">
                                {message}
                            </p>
                            <p style="margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #333;">
                                Vui lòng đăng nhập vào hệ thống để xem chi tiết lịch làm việc của bạn.
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 20px 40px; background-color: #f8f9fa; border-top: 1px solid #eee;">
                            <p style="margin: 0; font-size: 12px; color: #999; line-height: 1.5;">
                                Email này được gửi bởi Tamabee HR.<br>
                                © {year} Tamabee. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
