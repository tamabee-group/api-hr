<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f4;">
        <tr>
            <td align="center" style="padding: 30px 0;">
                <table width="600" cellpadding="0" cellspacing="0"
                    style="background-color: #ffffff; border-radius: 4px; overflow: hidden;">
                    <!-- Header với logo -->
                    <tr>
                        <td style="background-color: #232f3e; padding: 24px; text-align: center;">
                            <span
                                style="font-size: 28px; font-weight: bold; color: #00ddff; letter-spacing: 2px;">TAMABEE</span>
                        </td>
                    </tr>

                    <!-- Nội dung chính -->
                    <tr>
                        <td style="padding: 30px 20px;">
                            <h1 style="margin: 0 0 20px; font-size: 24px; font-weight: bold; color: #232f3e;">
                                🔔 Công ty mới đăng ký
                            </h1>

                            <!-- Thông tin công ty -->
                            <table width="100%" cellpadding="0" cellspacing="0"
                                style="background-color: #f8f9fa; border-radius: 4px; margin: 20px 0;">
                                <tr>
                                    <td style="padding: 20px;">
                                        <table width="100%" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td
                                                    style="padding: 10px 0; font-size: 14px; color: #666; width: 140px;">
                                                    Tên công ty:</td>
                                                <td style="padding: 10px 0; font-size: 14px; font-weight: bold;">
                                                    {companyName}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 10px 0; font-size: 14px; color: #666;">Chủ sở hữu:
                                                </td>
                                                <td style="padding: 10px 0; font-size: 14px;">
                                                    {ownerName}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 10px 0; font-size: 14px; color: #666;">Email:</td>
                                                <td style="padding: 10px 0; font-size: 14px;">
                                                    <a href="mailto:{email}" style="color: #00b1ce;">{email}</a>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 10px 0; font-size: 14px; color: #666;">Tenant
                                                    domain:</td>
                                                <td style="padding: 10px 0; font-size: 14px; font-weight: bold;">
                                                    {tenantDomain}.tamabee.vn
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 10px 0; font-size: 14px; color: #666;">Mã giới
                                                    thiệu:</td>
                                                <td style="padding: 10px 0; font-size: 14px;">
                                                    {referralCode}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 10px 0; font-size: 14px; color: #666;">Người giới
                                                    thiệu:</td>
                                                <td style="padding: 10px 0; font-size: 14px;">
                                                    {referrerName}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 10px 0; font-size: 14px; color: #666;">Thời gian:
                                                </td>
                                                <td style="padding: 10px 0; font-size: 14px;">
                                                    {date}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 20px 40px; background-color: #f8f9fa; border-top: 1px solid #eee;">
                            <p style="margin: 0; font-size: 12px; color: #999; line-height: 1.5;">
                                Email tự động từ hệ thống Tamabee HR.<br>
                                © {year} Tamabee. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
