<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #fff;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #fff;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0"
                    style="background-color: #ffffff; border-radius: 4px; overflow: hidden;">
                    <!-- Header với logo -->
                    <tr>
                        <td style="background-color: #232f3e; padding: 24px; text-align: center;">
                            <img src="cid:logo" alt="Tamabee"
                                style="height: 40px; width: auto; vertical-align: middle; margin-right: 8px;">
                            <img src="cid:logoText" alt="Tamabee"
                                style="height: 32px; width: auto; vertical-align: middle;">
                        </td>
                    </tr>

                    <!-- Nội dung chính -->
                    <tr>
                        <td style="padding: 30px 20px;">
                            <h1 style="margin: 0 0 20px; font-size: 24px; font-weight: bold; color: #232f3e;">
                                💰 Yêu cầu nạp tiền mới
                            </h1>

                            <!-- Thông tin yêu cầu -->
                            <table width="100%" cellpadding="0" cellspacing="0"
                                style="background-color: #f8f9fa; border-radius: 4px; margin: 20px 0;">
                                <tr>
                                    <td style="padding: 20px;">
                                        <table width="100%" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td
                                                    style="padding: 10px 0; font-size: 14px; color: #666; width: 140px;">
                                                    Công ty:</td>
                                                <td style="padding: 10px 0; font-size: 14px; font-weight: bold;">
                                                    {companyName}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 10px 0; font-size: 14px; color: #666;">Số tiền:</td>
                                                <td
                                                    style="padding: 10px 0; font-size: 18px; font-weight: bold; color: #00b1ce;">
                                                    {amount}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 10px 0; font-size: 14px; color: #666;">Người gửi:
                                                </td>
                                                <td style="padding: 10px 0; font-size: 14px;">
                                                    {requesterName}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 10px 0; font-size: 14px; color: #666;">Email:</td>
                                                <td style="padding: 10px 0; font-size: 14px;">
                                                    <a href="mailto:{requesterEmail}"
                                                        style="color: #00b1ce;">{requesterEmail}</a>
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 10px 0; font-size: 14px; color: #666;">Thời gian:
                                                </td>
                                                <td style="padding: 10px 0; font-size: 14px;">
                                                    {date}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            <!-- Ảnh chứng từ -->
                            <p style="margin: 20px 0 10px; font-size: 14px; font-weight: bold; color: #333;">
                                📷 Ảnh chứng từ chuyển khoản:
                            </p>
                            <div style="text-align: center; margin: 15px 0;">
                                <img src="{transferProofUrl}" alt="Chứng từ chuyển khoản"
                                    style="max-width: 100%; max-height: 400px; border-radius: 4px; border: 1px solid #ddd;">
                            </div>

                            <!-- Button xem chi tiết -->
                            <table width="100%" cellpadding="0" cellspacing="0" style="margin: 30px 0;">
                                <tr>
                                    <td align="center">
                                        <a href="{adminUrl}"
                                            style="display: inline-block; padding: 14px 40px; background-color: #0061fe; color: #ffffff; text-decoration: none; font-size: 16px; font-weight: bold; border-radius: 4px;">
                                            Xem chi tiết & Duyệt
                                        </a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 20px 40px; background-color: #f8f9fa; border-top: 1px solid #eee;">
                            <p style="margin: 0; font-size: 12px; color: #999; line-height: 1.5;">
                                Email tự động từ hệ thống Tamabee HR.<br>
                                © {year} Tamabee. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
