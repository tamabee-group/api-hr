<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #fff;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #fff;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0"
                    style="background-color: #ffffff; border-radius: 4px; overflow: hidden;">
                    <!-- Header with logo -->
                    <tr>
                        <td style="background-color: #232f3e; padding: 24px; text-align: center;">
                            <img src="cid:logo" alt="Tamabee"
                                style="height: 40px; width: auto; vertical-align: middle; margin-right: 8px;">
                            <img src="cid:logoText" alt="Tamabee"
                                style="height: 32px; width: auto; vertical-align: middle;">
                        </td>
                    </tr>

                    <!-- Main content -->
                    <tr>
                        <td style="padding: 30px 20px;">
                            <h1 style="margin: 0 0 20px; font-size: 24px; font-weight: bold; color: #dc3545;">
                                ⚠️ ウォレット残高不足
                            </h1>
                            <p style="margin: 0 0 20px; font-size: 16px; color: #333;">
                                {companyName}様
                            </p>
                            <p style="margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #333;">
                                ウォレット残高不足のため、月額サブスクリプション料金を引き落とすことができませんでした。
                            </p>

                            <!-- Payment info -->
                            <table width="100%" cellpadding="0" cellspacing="0"
                                style="background-color: #fff3cd; border-radius: 4px; margin: 20px 0;">
                                <tr>
                                    <td style="padding: 20px;">
                                        <p
                                            style="margin: 0 0 15px; font-size: 14px; font-weight: bold; color: #856404;">
                                            決済情報
                                        </p>
                                        <table width="100%" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #856404;">プラン:</td>
                                                <td
                                                    style="padding: 8px 0; font-size: 14px; font-weight: bold; text-align: right;">
                                                    {planName}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #856404;">必要金額:</td>
                                                <td
                                                    style="padding: 8px 0; font-size: 14px; font-weight: bold; color: #dc3545; text-align: right;">
                                                    {amount}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #856404;">現在の残高:</td>
                                                <td
                                                    style="padding: 8px 0; font-size: 14px; font-weight: bold; color: #dc3545; text-align: right;">
                                                    {balance}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Warning -->
                    <tr>
                        <td style="padding: 0 40px 40px;">
                            <table width="100%" cellpadding="0" cellspacing="0"
                                style="background-color: #f8d7da; border-radius: 4px; border-left: 4px solid #dc3545;">
                                <tr>
                                    <td style="padding: 16px 20px;">
                                        <p style="margin: 0 0 8px; font-size: 14px; font-weight: bold; color: #721c24;">
                                            🚨 アカウントが一時停止されました
                                        </p>
                                        <p style="margin: 0; font-size: 13px; color: #721c24; line-height: 1.5;">
                                            サービスを継続してご利用いただくには、すぐにウォレットに入金してください。
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 20px 40px; background-color: #f8f9fa; border-top: 1px solid #eee;">
                            <p style="margin: 0; font-size: 12px; color: #999; line-height: 1.5;">
                                このメールはTamabee HRから送信されました。<br>
                                © {year} Tamabee. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
