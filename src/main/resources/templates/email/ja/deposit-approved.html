<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #fff;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #fff;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0"
                    style="background-color: #ffffff; border-radius: 4px; overflow: hidden;">
                    <!-- Header with logo -->
                    <tr>
                        <td style="background-color: #232f3e; padding: 24px; text-align: center;">
                            <span
                                style="font-size: 28px; font-weight: bold; color: #00ddff; letter-spacing: 2px;">TAMABEE</span>
                        </td>
                    </tr>

                    <!-- Main content -->
                    <tr>
                        <td style="padding: 30px 20px;">
                            <h1 style="margin: 0 0 20px; font-size: 24px; font-weight: bold; color: #28a745;">
                                ✅ 入金が完了しました
                            </h1>
                            <p style="margin: 0 0 20px; font-size: 16px; color: #333;">
                                {companyName}様
                            </p>
                            <p style="margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #333;">
                                入金リクエストが承認されました。
                                ウォレット残高が更新されました。
                            </p>

                            <!-- Transaction details -->
                            <table width="100%" cellpadding="0" cellspacing="0"
                                style="background-color: #f0f9ff; border-radius: 4px; margin: 20px 0;">
                                <tr>
                                    <td style="padding: 20px;">
                                        <p
                                            style="margin: 0 0 15px; font-size: 14px; font-weight: bold; color: #00b1ce;">
                                            取引詳細
                                        </p>
                                        <table width="100%" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #666;">入金額:</td>
                                                <td
                                                    style="padding: 8px 0; font-size: 16px; font-weight: bold; color: #28a745; text-align: right;">
                                                    {amount}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #666;">現在の残高:</td>
                                                <td
                                                    style="padding: 8px 0; font-size: 16px; font-weight: bold; color: #00b1ce; text-align: right;">
                                                    {balance}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #666;">取引日:</td>
                                                <td style="padding: 8px 0; font-size: 14px; text-align: right;">
                                                    {date}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Support -->
                    <tr>
                        <td style="padding: 0 40px 40px;">
                            <table width="100%" cellpadding="0" cellspacing="0"
                                style="background-color: #f8f9fa; border-radius: 4px; border-left: 4px solid #00b1ce;">
                                <tr>
                                    <td style="padding: 16px 20px;">
                                        <p style="margin: 0; font-size: 13px; color: #666; line-height: 1.5;">
                                            ご不明な点がございましたら、
                                            <a href="mailto:contact@tamabee.vn"
                                                style="color: #00b1ce;">contact@tamabee.vn</a>
                                            までお問い合わせください。
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 20px 40px; background-color: #f8f9fa; border-top: 1px solid #eee;">
                            <p style="margin: 0; font-size: 12px; color: #999; line-height: 1.5;">
                                このメールはTamabee HRから送信されました。<br>
                                © {year} Tamabee. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
