<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #fff;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #fff;">
        <tr>
            <td align="center">
                <table width="600" cellpadding="0" cellspacing="0"
                    style="background-color: #ffffff; border-radius: 4px; overflow: hidden;">
                    <!-- Header with logo -->
                    <tr>
                        <td style="background-color: #232f3e; padding: 24px; text-align: center;">
                            <img src="cid:logo" alt="Tamabee"
                                style="height: 40px; width: auto; vertical-align: middle; margin-right: 8px;">
                            <img src="cid:logoText" alt="Tamabee"
                                style="height: 32px; width: auto; vertical-align: middle;">
                        </td>
                    </tr>

                    <!-- Main content -->
                    <tr>
                        <td style="padding: 30px 20px;">
                            <h1 style="margin: 0 0 20px; font-size: 24px; font-weight: bold; color: #28a745;">
                                ✅ 休暇申請が承認されました
                            </h1>
                            <p style="margin: 0 0 20px; font-size: 16px; color: #333;">
                                {employeeName}様
                            </p>
                            <p style="margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #333;">
                                休暇申請が承認されました。
                            </p>

                            <!-- Leave details -->
                            <table width="100%" cellpadding="0" cellspacing="0"
                                style="background-color: #f0f9ff; border-radius: 4px; margin: 20px 0;">
                                <tr>
                                    <td style="padding: 20px;">
                                        <p
                                            style="margin: 0 0 15px; font-size: 14px; font-weight: bold; color: #00b1ce;">
                                            休暇詳細
                                        </p>
                                        <table width="100%" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #666;">休暇種類:</td>
                                                <td
                                                    style="padding: 8px 0; font-size: 14px; font-weight: bold; text-align: right;">
                                                    {leaveType}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #666;">開始日:</td>
                                                <td
                                                    style="padding: 8px 0; font-size: 14px; font-weight: bold; color: #28a745; text-align: right;">
                                                    {startDate}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #666;">終了日:</td>
                                                <td
                                                    style="padding: 8px 0; font-size: 14px; font-weight: bold; color: #28a745; text-align: right;">
                                                    {endDate}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #666;">承認者:</td>
                                                <td
                                                    style="padding: 8px 0; font-size: 14px; font-weight: bold; text-align: right;">
                                                    {approverName}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #666;">
                                良い休暇をお過ごしください！
                            </p>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 20px 40px; background-color: #f8f9fa; border-top: 1px solid #eee;">
                            <p style="margin: 0; font-size: 12px; color: #999; line-height: 1.5;">
                                このメールはTamabee HRから送信されました。<br>
                                © {year} Tamabee. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
