<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

<body style="margin: 0; padding: 0; font-family: Arial, sans-serif; background-color: #f4f4f4;">
    <table width="100%" cellpadding="0" cellspacing="0" style="background-color: #f4f4f4;">
        <tr>
            <td align="center" style="padding: 30px 0;">
                <table width="600" cellpadding="0" cellspacing="0"
                    style="background-color: #ffffff; border-radius: 4px; overflow: hidden;">
                    <!-- Header with logo -->
                    <tr>
                        <td style="background-color: #232f3e; padding: 24px; text-align: center;">
                            <span
                                style="font-size: 28px; font-weight: bold; color: #00ddff; letter-spacing: 2px;">TAMABEE</span>
                        </td>
                    </tr>

                    <!-- Main content -->
                    <tr>
                        <td style="padding: 30px 20px;">
                            <h1 style="margin: 0 0 20px; font-size: 24px; font-weight: bold; color: #232f3e;">
                                サブスクリプション決済のお知らせ
                            </h1>
                            <p style="margin: 0 0 20px; font-size: 16px; color: #333;">
                                {companyName}様
                            </p>
                            <p style="margin: 0 0 20px; font-size: 14px; line-height: 1.6; color: #333;">
                                月額サブスクリプション料金がウォレットから自動引き落としされました。
                            </p>

                            <!-- Payment details -->
                            <table width="100%" cellpadding="0" cellspacing="0"
                                style="background-color: #f8f9fa; border-radius: 4px; margin: 20px 0;">
                                <tr>
                                    <td style="padding: 20px;">
                                        <p style="margin: 0 0 15px; font-size: 14px; font-weight: bold; color: #666;">
                                            決済詳細
                                        </p>
                                        <table width="100%" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #666;">プラン:</td>
                                                <td
                                                    style="padding: 8px 0; font-size: 14px; font-weight: bold; text-align: right;">
                                                    {planName}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #666;">決済金額:</td>
                                                <td
                                                    style="padding: 8px 0; font-size: 14px; font-weight: bold; color: #dc3545; text-align: right;">
                                                    {amount}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #666;">残高:</td>
                                                <td
                                                    style="padding: 8px 0; font-size: 14px; font-weight: bold; color: #00b1ce; text-align: right;">
                                                    {balance}
                                                </td>
                                            </tr>
                                            <tr>
                                                <td style="padding: 8px 0; font-size: 14px; color: #666;">決済日:</td>
                                                <td style="padding: 8px 0; font-size: 14px; text-align: right;">
                                                    {date}
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>
                            </table>

                            <p style="margin: 0; font-size: 14px; line-height: 1.6; color: #666;">
                                📅 次回の決済は来月に行われます。
                            </p>
                        </td>
                    </tr>

                    <!-- Note -->
                    <tr>
                        <td style="padding: 0 40px 40px;">
                            <table width="100%" cellpadding="0" cellspacing="0"
                                style="background-color: #f8f9fa; border-radius: 4px; border-left: 4px solid #00b1ce;">
                                <tr>
                                    <td style="padding: 16px 20px;">
                                        <p style="margin: 0; font-size: 13px; color: #666; line-height: 1.5;">
                                            サービスの中断を避けるため、ウォレットに十分な残高があることをご確認ください。
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="padding: 20px 40px; background-color: #f8f9fa; border-top: 1px solid #eee;">
                            <p style="margin: 0; font-size: 12px; color: #999; line-height: 1.5;">
                                このメールはTamabee HRから送信されました。<br>
                                © {year} Tamabee. All rights reserved.
                            </p>
                        </td>
                    </tr>
                </table>
            </td>
        </tr>
    </table>
</body>

</html>
